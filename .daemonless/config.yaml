icon: ':material-server-network:'
cit:
  port: 8080
  ready: "Starting provider"

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      # :k8s was a separate exit-on-failure build under s6; base-exec images
      # always exit with the app, so it's the same image now.
      aliases: ["k8s"]
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15-latest"
