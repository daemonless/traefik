icon: ':material-server-network:'
cit:
  port: 8080
  ready: "Starting provider"

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15-latest"
    - tag: k8s
      containerfile: Containerfile
      args:
        DAEMONLESS_SUPERVISE: "orchestrator"
      puid: false
      tag_desc: "Same as :latest (s6) but with DAEMONLESS_SUPERVISE=orchestrator baked in: a service exit terminates the container so the orchestrator (Kubernetes, etc.) restarts the pod."
